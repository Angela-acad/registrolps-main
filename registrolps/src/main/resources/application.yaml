server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/registro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Configuración para subida de archivos (dentro de spring)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Configuración personalizada para la carpeta de subidas (fuera de spring, al mismo nivel)
file:
  upload-dir: uploads